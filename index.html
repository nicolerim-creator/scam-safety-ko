<body style="font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 16px;">

  <!-- Header Section -->
  <header style="text-align: center; margin-bottom: 30px;">
    <h1 style="font-size: 28px; color: #111;">시니어 금융사기 예방</h1>

  <!-- ==================================================== -->
  <!-- PASTE "UPDATE YOUR LESSON CARDS" CODE HERE (INSIDE BODY) -->

  <!-- Lesson 1: Text Message Scams -->
  <div class="senior-card" style="border: 2px solid #ccc; border-radius: 16px; padding: 24px; margin: 20px 0; text-align: center; background-color: #f9f9f9;">
    <div style="font-size: 50px; margin-bottom: 10px;">📩</div>
    <h2 style="font-size: 26px; font-weight: bold; margin-bottom: 15px; color: #111;">1. 의심스러운 문자</h2>
    
    <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
      <button onclick="speakKorean('첫 번째 수칙입니다. 가족이나 지인을 사칭하여 돈이나 개인정보를 요구하는 문자를 받으셨나요? 문자에 들어있는 인터넷 주소 링크는 절대로 누르지 마세요.')" 
              style="background-color: #0052CC; color: white; font-size: 22px; font-weight: bold; padding: 16px 28px; border: none; border-radius: 50px; cursor: pointer; flex: 1; max-width: 200px;">
        🔊 듣기
      </button>
      <button onclick="stopKorean()" 
              style="background-color: #6B7280; color: white; font-size: 22px; font-weight: bold; padding: 16px 20px; border: none; border-radius: 50px; cursor: pointer;">
        ⏹️ 멈춤
      </button>
    </div>

    <p style="font-size: 20px; line-height: 1.6; color: #333; margin: 0;">
      <strong>핵심:</strong> 문자에 있는 링크는 <strong>절대로 누르지 마세요!</strong>
    </p>
  </div>

  <!-- Lesson 2: Bank Impersonation -->
  <div class="senior-card" style="border: 2px solid #ccc; border-radius: 16px; padding: 24px; margin: 20px 0; text-align: center; background-color: #f9f9f9;">
    <div style="font-size: 50px; margin-bottom: 10px;">🏦</div>
    <h2 style="font-size: 26px; font-weight: bold; margin-bottom: 15px; color: #111;">2. 은행 사칭 전화</h2>
    
    <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
      <button onclick="speakKorean('두 번째 수칙입니다. 은행이나 경찰이라고 하면서 계좌 비밀번호나 현금 이체를 요구하는 전화는 100% 사기입니다. 바로 전화를 끊으세요.')"

    <p style="font-size: 20px; line-height: 1.6; color: #333; margin: 0;">
      <strong>핵심:</strong> 비밀번호를 묻는 전화는 <strong>즉시 끊으세요!</strong>
    </p>
  </div>

  <!-- Lesson 3: App Installation Warning -->
  <div class="senior-card" style="border: 2px solid #ccc; border-radius: 16px; padding: 24px; margin: 20px 0; text-align: center; background-color: #f9f9f9;">
    <div style="font-size: 50px; margin-bottom: 10px;">📲</div>
    <h2 style="font-size: 26px; font-weight: bold; margin-bottom: 15px; color: #111;">3. 수상한 앱 설치 금지</h2>
    
    <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
      <button onclick="speakKorean('세 번째 수칙입니다. 원격 제어 앱이나 보안 앱을 설치하라는 요구에 응하지 마세요. 핸드폰이 해킹될 위험이 있습니다.')" 
              style="background-color: #0052CC; color: white; font-size: 22px; font-weight: bold; padding: 16px 28px; border: none; border-radius: 50px; cursor: pointer; flex: 1; max-width: 200px;">
        🔊 듣기

              style="background-color: #6B7280; color: white; font-size: 22px; font-weight: bold; padding: 16px 20px; border: none; border-radius: 50px; cursor: pointer;">

    <p style="font-size: 20px; line-height: 1.6; color: #333; margin: 0;">

    </p>
  </div>

  <!-- ==================================================== -->
  <!-- JAVASCRIPT AUDIO ENGINE (PLACE AT THE VERY BOTTOM) -->
  <!-- ==================================================== -->
  <script>
    function speakKorean(text) {
      window.speechSynthesis.cancel(); // Stop any currently playing audio
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.8; // Slower pace for elderly listeners
      window.speechSynthesis.speak(utterance);
    }

    function stopKorean() {
      window.speechSynthesis.cancel();
    }
  </script>
